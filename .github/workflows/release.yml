name: Release
run-name: ${{ inputs.description != '' && format('pyheavydb — {0}', inputs.description) || 'pyheavydb Release' }}

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Branch or SHA to build'
        type: string
        default: 'master'
      description:
        description: 'Build description label'
        type: string
        default: ''

jobs:
  build:
    runs-on: linux-amd64-cpu16
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned Thrift compiler and build tools
        run: |
          source ci/thrift.env
          make check-thrift-config

          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bison build-essential curl flex libtool

          archive="$RUNNER_TEMP/thrift-$THRIFT_VERSION.tar.gz"
          source_dir="$RUNNER_TEMP/thrift-$THRIFT_VERSION"
          prefix="$RUNNER_TEMP/thrift-install"
          curl -fsSL "https://archive.apache.org/dist/thrift/$THRIFT_VERSION/thrift-$THRIFT_VERSION.tar.gz" -o "$archive"
          echo "$THRIFT_SHA256  $archive" | sha256sum --check -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          cd "$source_dir"
          ./configure --prefix="$prefix" --enable-libs=no --enable-tests=no --enable-tutorial=no --without-cpp --without-go --without-java --without-python
          make -j"$(nproc)"
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/thrift" -version | grep -Fx "Thrift version $THRIFT_VERSION"
          pip install build

      - name: Generate thrift bindings and build wheel
        run: |
          make thrift
          python -m build --wheel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          TAG="pyheavydb-${SHA::8}"
          TITLE="pyheavydb ${TAG}"
          if [ -n "${{ inputs.description }}" ]; then
            TITLE="$TITLE — ${{ inputs.description }}"
          fi
          gh release create "$TAG" dist/*.whl \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --notes "Built from \`${{ inputs.release_candidate }}\` (${SHA}) — run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
