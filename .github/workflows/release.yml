name: Release

on:
  push:
    branches:
      - misiug/gh-actions-release
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Branch or SHA to build'
        type: string
        default: 'master'

jobs:
  build:
    runs-on: linux-amd64-cpu16
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_candidate }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install thrift compiler and build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q thrift-compiler
          pip install build

      - name: Generate thrift bindings and build wheel
        run: |
          make thrift
          python -m build --wheel

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          TAG="pyheavydb-${SHA::8}"
          gh release create "$TAG" dist/*.whl \
            --repo "${{ github.repository }}" \
            --title "pyheavydb ${TAG}" \
            --notes "Built from \`${{ inputs.release_candidate }}\` (${SHA}) — run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
